name: Android APK

on:
  push:
    branches: [main, feature/offline-file-transfer, fix/nearby-transfer-session]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.samirnet .
      - name: Configure permissions for offline nearby transfer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />',
              '    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />',
          ]
          for permission in permissions:
              permission_name = permission.split('android:name="', 1)[1].split('"', 1)[0]
              if permission_name not in text:
                  if '<application' not in text:
                      raise SystemExit('AndroidManifest.xml has no application element')
                  text = text.replace('<application', permission + '\n    <application', 1)
          manifest.write_text(text)
          for required in ('android.permission.CAMERA', 'android.permission.NEARBY_WIFI_DEVICES'):
              if required not in manifest.read_text():
                  raise SystemExit('Missing required permission: ' + required)
          print('Configured and verified camera and offline nearby-transfer permissions.')
          PY
      - name: Create SM Player launcher icon
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math

          root = Path('android/app/src/main/res')
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in sizes.items():
              image = Image.new('RGBA', (size, size), (239, 68, 68, 255))
              d = ImageDraw.Draw(image)
              # Soft inset rounded-square badge and a clear white video/play mark.
              inset = int(size * .08)
              d.rounded_rectangle((inset, inset, size-inset-1, size-inset-1),
                                  radius=int(size*.22), fill=(220, 38, 38, 255))
              # A clear white play triangle on a solid red background.
              d.polygon([(int(size*.39), int(size*.31)),
                         (int(size*.39), int(size*.69)),
                         (int(size*.68), int(size*.50))], fill='white')
              image.save(root / f'mipmap-{density}' / 'ic_launcher.png')
          drawable = root / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          # Android media notifications require a dedicated small, monochrome icon.
          raw = root / 'raw'
          raw.mkdir(parents=True, exist_ok=True)
          (raw / 'keep.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_stat_player" />
          ''')
          (drawable / 'ic_stat_player.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M8,5 L8,19 L19,12 Z"/>
          </vector>
          ''')
          (drawable / 'ic_launcher_foreground.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF" android:pathData="M39,31 L39,77 L70,54 Z"/>
          </vector>
          ''')
          (root / 'values').mkdir(parents=True, exist_ok=True)
          colors = root / 'values' / 'ic_launcher_background.xml'
          colors.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#EF4444</color></resources>
          ''')
          adaptive = root / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / 'ic_launcher.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          ''')
          (adaptive / 'ic_launcher_round.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          ''')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:icon=' not in text:
              text = text.replace('<application', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          else:
              import re
              text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text, count=1)
              if 'android:roundIcon=' not in text:
                  text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
              else:
                  text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text, count=1)
          manifest.write_text(text)
          print('Generated red SM Player video launcher icons for legacy and adaptive Android launchers.')
          PY
      - name: Set Android package name and release signing from GitHub Secrets
        shell: bash
        env:
          SN_KEYSTORE_BASE64: ${{ secrets.SN_KEYSTORE_BASE64 }}
          SN_KEYSTORE_PASSWORD: ${{ secrets.SN_KEYSTORE_PASSWORD }}
          SN_KEY_ALIAS: ${{ secrets.SN_KEY_ALIAS }}
          SN_KEY_PASSWORD: ${{ secrets.SN_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, base64, subprocess

          package = 'com.samirnet.snplayer'
          gradle = next((p for p in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')] if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle build file was not generated')
          text = gradle.read_text()
          if gradle.suffix == '.kts':
              text = re.sub(r"""(?m)^\s*namespace\s*=\s*["'][^"']+["']""", f'    namespace = "{package}"', text)
              text = re.sub(r"""(?m)^\s*applicationId\s*=\s*["'][^"']+["']""", f'        applicationId = "{package}"', text)
          else:
              text = re.sub(r"""(?m)^\s*namespace\s+["'][^"']+["']""", f"    namespace '{package}'", text)
              text = re.sub(r"""(?m)^\s*applicationId\s+["'][^"']+["']""", f"        applicationId '{package}'", text)
          if not re.search(r'(?m)^\s*namespace', text) or not re.search(r'(?m)^\s*applicationId', text):
              raise SystemExit('Could not set Android namespace/applicationId')

          env = {k: os.environ.get(k, '').strip() for k in ('SN_KEYSTORE_BASE64','SN_KEYSTORE_PASSWORD','SN_KEY_ALIAS','SN_KEY_PASSWORD')}
          if all(env.values()):
              keystore = Path('android/app/sameer-player-release.jks')
              keystore.write_bytes(base64.b64decode(env['SN_KEYSTORE_BASE64'], validate=True))
              alias = env['SN_KEY_ALIAS']
              if not alias:
                  listing = subprocess.run(['keytool','-list','-keystore',str(keystore),'-storepass',env['SN_KEYSTORE_PASSWORD']], text=True, capture_output=True)
                  if listing.returncode:
                      raise SystemExit('Could not read keystore. Check SN_KEYSTORE_PASSWORD.')
                  match = re.search(r'(?m)^([^,]+), .*PrivateKeyEntry', listing.stdout)
                  if not match:
                      raise SystemExit('Set SN_KEY_ALIAS manually; no single private-key alias could be detected.')
                  alias = match.group(1).strip()
              props = Path('android/key.properties')
              props.write_text('storePassword=' + env['SN_KEYSTORE_PASSWORD'] + chr(10) + 'keyPassword=' + env['SN_KEY_PASSWORD'] + chr(10) + 'keyAlias=' + alias + chr(10) + 'storeFile=app/sameer-player-release.jks' + chr(10))
              listing = subprocess.run(['keytool','-list','-v','-keystore',str(keystore),'-storepass',env['SN_KEYSTORE_PASSWORD'],'-alias',alias], text=True, capture_output=True)
              if listing.returncode:
                  raise SystemExit('Could not inspect signing certificate; verify the keystore password and alias.')
              sha = re.search(r'(?im)^\s*SHA1:\s*(.+)$', listing.stdout)
              if sha:
                  print('Release signing certificate SHA-1: ' + sha.group(1).strip())
              else:
                  print(listing.stdout)
              if gradle.suffix == '.kts':
                  # Kotlin DSL requires the plugins block before ordinary statements.
                  # Use fully-qualified Java classes and insert keystore loading after plugins.
                  # Kotlin DSL imports must be at the very beginning of the script.
                  text = re.sub(r'(?m)^import java\.util\.Properties\s*\n', '', text)
                  text = re.sub(r'(?m)^import java\.io\.FileInputStream\s*\n', '', text)
                  text = 'import java.util.Properties' + chr(10) + 'import java.io.FileInputStream' + chr(10) + text
                  load = 'val keystoreProperties = Properties()' + chr(10) + 'val keystorePropertiesFile = rootProject.file("key.properties")' + chr(10) + 'if (!keystorePropertiesFile.exists()) error("Release signing key.properties is missing")' + chr(10) + 'keystoreProperties.load(FileInputStream(keystorePropertiesFile))' + chr(10) + chr(10)
                  if 'val keystoreProperties = Properties()' not in text:
                      match = re.search(r'(?s)plugins\s*\{.*?\}', text)
                      if not match:
                          raise SystemExit('Could not find plugins block in Kotlin Gradle file')
                      text = text[:match.end()] + chr(10) + chr(10) + load + text[match.end():]
                  signing = '    signingConfigs {' + chr(10) + '        create("snRelease") {' + chr(10) + '            keyAlias = keystoreProperties["keyAlias"] as String' + chr(10) + '            keyPassword = keystoreProperties["keyPassword"] as String' + chr(10) + '            storeFile = file(keystoreProperties["storeFile"] as String)' + chr(10) + '            storePassword = keystoreProperties["storePassword"] as String' + chr(10) + '        }' + chr(10) + '    }' + chr(10)
                  if 'create("snRelease")' not in text:
                      text = text.replace('android {', 'android {' + chr(10) + signing, 1)
                  if 'signingConfig = signingConfigs.getByName("snRelease")' not in text:
                      text = re.sub(r'(release\s*\{)', r'\1' + chr(10) + '            signingConfig = signingConfigs.getByName("snRelease")', text, count=1)
              else:
                  if 'import java.util.Properties' not in text:
                      text = 'import java.util.Properties' + chr(10) + 'import java.io.FileInputStream' + chr(10) + text
                  load = 'def keystoreProperties = new Properties()' + chr(10) + "def keystorePropertiesFile = rootProject.file('key.properties')" + chr(10) + 'if (keystorePropertiesFile.exists()) {' + chr(10) + '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))' + chr(10) + '}' + chr(10) + chr(10)
                  if 'def keystoreProperties = new Properties()' not in text:
                      text = load + text
                  signing = "    signingConfigs {" + chr(10) + "        snRelease {" + chr(10) + "            keyAlias keystoreProperties['keyAlias']" + chr(10) + "            keyPassword keystoreProperties['keyPassword']" + chr(10) + "            storeFile file(keystoreProperties['storeFile'])" + chr(10) + "            storePassword keystoreProperties['storePassword']" + chr(10) + "        }" + chr(10) + "    }" + chr(10)
                  if 'snRelease {' not in text:
                      text = text.replace('android {', 'android {' + chr(10) + signing, 1)
                  if 'signingConfig signingConfigs.snRelease' not in text:
                      text = re.sub(r'(release\s*\{)', r'\1' + chr(10) + '            signingConfig signingConfigs.snRelease', text, count=1)
              print('Release signing configured using the provided keystore.')
          else:
              raise SystemExit('Missing signing secrets. Set SN_KEYSTORE_BASE64, SN_KEYSTORE_PASSWORD, SN_KEY_ALIAS, and SN_KEY_PASSWORD before building a release APK.')
          gradle.write_text(text)
          print('Android applicationId and namespace set to ' + package)
          PY
      - name: Align Android MainActivity package with applicationId
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = 'com.samirnet.snplayer'
          roots = [Path('android/app/src/main/kotlin'), Path('android/app/src/main/java')]
          matches = [p for root in roots if root.exists() for ext in ('kt', 'java') for p in root.rglob('MainActivity.' + ext)]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one MainActivity source file; found {len(matches)}: {matches}')

          activity = matches[0]
          lines = activity.read_text().splitlines()
          package_lines = [i for i, line in enumerate(lines) if line.startswith('package ')]
          if len(package_lines) != 1:
              raise SystemExit(f'Expected one package declaration in {activity}')
          lines[package_lines[0]] = 'package ' + expected
          source = '\n'.join(lines) + '\n'
          if activity.suffix == '.kt':
              for imp in [
                  'import android.app.PictureInPictureParams',
                  'import android.os.Build',
                  'import android.os.Environment',
                  'import android.provider.Settings',
                  'import android.content.Intent',
                  'import android.net.Uri',
                  'import android.util.Rational',
                  'import com.ryanheise.audioservice.AudioServiceActivity',
                  'import io.flutter.embedding.engine.FlutterEngine',
                  'import io.flutter.plugin.common.MethodChannel',
              ]:
                  if imp not in source:
                      source = source.replace('import io.flutter.embedding.android.FlutterActivity', 'import io.flutter.embedding.android.FlutterActivity\n' + imp, 1)
              declaration = 'class MainActivity : FlutterActivity()'
              implementation = '''class MainActivity : AudioServiceActivity() {
              private var pendingNotificationPermissionResult: MethodChannel.Result? = null

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1001) {
                      val granted = grantResults.isNotEmpty() &&
                          grantResults[0] == android.content.pm.PackageManager.PERMISSION_GRANTED
                      pendingNotificationPermissionResult?.success(granted)
                      pendingNotificationPermissionResult = null
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.samirnet.snplayer/pip")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "enterPip") {
                              result.notImplemented()
                          } else if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                              result.success(false)
                          } else {
                              try {
                                  val params = PictureInPictureParams.Builder()
                                      .setAspectRatio(Rational(16, 9))
                                      .build()
                                  result.success(enterPictureInPictureMode(params))
                              } catch (error: Exception) {
                                  result.error("PIP_FAILED", error.message, null)
                              }
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.samirnet.snplayer/notifications")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "requestPermission" -> {
                                  if (Build.VERSION.SDK_INT < 33 ||
                                      checkSelfPermission("android.permission.POST_NOTIFICATIONS") == android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                      result.success(true)
                                  } else if (pendingNotificationPermissionResult != null) {
                                      result.error("PERMISSION_REQUEST_IN_PROGRESS", "Notification permission request is already in progress", null)
                                  } else {
                                      pendingNotificationPermissionResult = result
                                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1001)
                                  }
                              }
                              "requestAllFilesAccess" -> {
                                  if (Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {
                                      try {
                                          val intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                              Uri.parse("package:" + packageName))
                                          startActivity(intent)
                                      } catch (error: Exception) {
                                          result.error("ALL_FILES_SETTINGS_FAILED", error.message, null)
                                          return@setMethodCallHandler
                                      }
                                  }
                                  result.success(Build.VERSION.SDK_INT < 30 || Environment.isExternalStorageManager())
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }'''
              if declaration not in source and 'setMethodCallHandler' not in source:
                  raise SystemExit('Unexpected Kotlin MainActivity template; cannot safely add PiP channel')
              if declaration in source:
                  source = source.replace(declaration, implementation, 1)
          else:
              raise SystemExit('Expected generated Kotlin MainActivity to configure Picture-in-Picture safely')
          activity.write_text(source)

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          if 'android:name=".MainActivity"' not in manifest and 'android:name="com.samirnet.snplayer.MainActivity"' not in manifest:
              raise SystemExit('Android manifest does not declare the expected MainActivity')
          import re
          pattern = r'(<activity\b(?=[^>]*android:name="(?:\.MainActivity|com\.samirnet\.snplayer\.MainActivity)")[^>]*)(>)'
          def add_pip(match):
              tag = match.group(1)
              if 'android:supportsPictureInPicture=' not in tag:
                  tag += ' android:supportsPictureInPicture="true"'
              if 'android:configChanges=' not in tag:
                  tag += ' android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation"'
              return tag + match.group(2)
          manifest, count = re.subn(pattern, add_pip, manifest, count=1, flags=re.DOTALL)
          if count != 1 or 'android:supportsPictureInPicture="true"' not in manifest:
              raise SystemExit('Could not enable Picture-in-Picture on MainActivity')
          manifest_path.write_text(manifest)
          print(f'Verified MainActivity package and Picture-in-Picture support: {expected} ({activity})')
          PY
      - name: Configure Android media playback notification service
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = path.read_text()
          permissions = [
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
          ]
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}"/>'
              if permission not in manifest:
                  manifest = manifest.replace('<application', tag + '\n    <application', 1)
          service = '''    <service
                  android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true"
                  android:stopWithTask="false">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>
              <receiver
                  android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON" />
                  </intent-filter>
              </receiver>
          '''
          # Media3 is the sole owner of playback notifications and media buttons.
          # Do not add the legacy audio_service service or receiver.
          import re
          manifest = re.sub(
              r'\s*<service\b(?=[^>]*android:name="com\.ryanheise\.audioservice\.AudioService")[\s\S]*?</service>',
              '',
              manifest,
          )
          manifest = re.sub(
              r'\s*<receiver\b(?=[^>]*android:name="com\.ryanheise\.audioservice\.MediaButtonReceiver")[\s\S]*?</receiver>',
              '',
              manifest,
          )
          if 'com.ryanheise.audioservice.AudioService' in manifest or 'com.ryanheise.audioservice.MediaButtonReceiver' in manifest:
              raise SystemExit('Legacy audio_service components conflict with Media3 notification ownership')
          path.write_text(manifest)
          import xml.etree.ElementTree as ET
          ET.parse(path)
          saved = path.read_text()
          for permission in permissions:
              if permission not in saved:
                  raise SystemExit('Missing media permission after manifest update: ' + permission)
          print('Configured and validated Media3 foreground playback permissions without legacy service conflicts.')
          PY
      - name: Wire Flutter to the native Media3 playback service
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = 'com.samirnet.snplayer'
          roots = [Path('android/app/src/main/kotlin'), Path('android/app/src/main/java')]
          matches = [p for root in roots if root.exists() for p in root.rglob('MainActivity.kt')]
          if len(matches) != 1:
              raise SystemExit(f'Expected one Kotlin MainActivity, found {len(matches)}')
          path = matches[0]
          source = path.read_text()
          if 'com.samirnet.snplayer/media3' in source:
              print('Native Media3 Flutter channel already present.')
          else:
              needle = '\n    }\n}'
              insertion = r'''
                  flutterEngine.platformViewsController.registry.registerViewFactory("com.samirnet.snplayer/video", SMPlayerVideoViewFactory())
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.samirnet.snplayer/media3")
                      .setMethodCallHandler { call, result ->
                          try {
                              val intent = Intent(this, SMPlayerMediaSessionService::class.java)
                              when (call.method) {
                                  "getState" -> {
                                      result.success(SMPlayerMediaSessionService.currentState())
                                      return@setMethodCallHandler
                                  }
                                  "playQueue" -> {
                                      val paths = (call.argument<List<String>>("paths") ?: emptyList()).toCollection(ArrayList())
                                      val titles = (call.argument<List<String>>("titles") ?: emptyList()).toCollection(ArrayList())
                                      if (paths.isEmpty() || paths.size != titles.size) {
                                          result.error("INVALID_QUEUE", "The media queue is empty or mismatched", null)
                                          return@setMethodCallHandler
                                      }
                                      intent.putExtra(SMPlayerMediaSessionService.EXTRA_ACTION, SMPlayerMediaSessionService.ACTION_PLAY_QUEUE)
                                      intent.putStringArrayListExtra(SMPlayerMediaSessionService.EXTRA_PATHS, paths)
                                      intent.putStringArrayListExtra(SMPlayerMediaSessionService.EXTRA_TITLES, titles)
                                      intent.putExtra(SMPlayerMediaSessionService.EXTRA_INDEX, call.argument<Int>("index") ?: 0)
                                      intent.putExtra(SMPlayerMediaSessionService.EXTRA_POSITION_MS, call.argument<Number>("positionMs")?.toLong() ?: 0L)
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                                  }
                                  "play", "pause", "stop", "skipNext", "skipPrevious", "seek", "setSpeed", "setRepeatMode", "setShuffle", "setVolume" -> {
                                      val action = when (call.method) {
                                          "play" -> SMPlayerMediaSessionService.ACTION_PLAY
                                          "pause" -> SMPlayerMediaSessionService.ACTION_PAUSE
                                          "stop" -> SMPlayerMediaSessionService.ACTION_STOP
                                          "skipNext" -> SMPlayerMediaSessionService.ACTION_SKIP_NEXT
                                          "skipPrevious" -> SMPlayerMediaSessionService.ACTION_SKIP_PREVIOUS
                                          "seek" -> SMPlayerMediaSessionService.ACTION_SEEK
                                          "setSpeed" -> SMPlayerMediaSessionService.ACTION_SET_SPEED
                                          "setRepeatMode" -> SMPlayerMediaSessionService.ACTION_SET_REPEAT
                                          "setShuffle" -> SMPlayerMediaSessionService.ACTION_SET_SHUFFLE
                                          else -> SMPlayerMediaSessionService.ACTION_SET_VOLUME
                                      }
                                      intent.putExtra(SMPlayerMediaSessionService.EXTRA_ACTION, action)
                                      when (call.method) {
                                          "seek" -> intent.putExtra(SMPlayerMediaSessionService.EXTRA_POSITION_MS, call.argument<Number>("positionMs")?.toLong() ?: 0L)
                                          "setSpeed" -> intent.putExtra(SMPlayerMediaSessionService.EXTRA_SPEED, (call.argument<Number>("speed")?.toFloat() ?: 1f))
                                          "setRepeatMode" -> intent.putExtra(SMPlayerMediaSessionService.EXTRA_REPEAT_MODE, call.argument<Int>("mode") ?: 0)
                                          "setShuffle" -> intent.putExtra(SMPlayerMediaSessionService.EXTRA_SHUFFLE, call.argument<Boolean>("enabled") ?: false)
                                          "setVolume" -> intent.putExtra(SMPlayerMediaSessionService.EXTRA_VOLUME, call.argument<Number>("volume")?.toFloat() ?: 1f)
                                      }
                                      startService(intent)
                                  }
                                  else -> {
                                      result.notImplemented()
                                      return@setMethodCallHandler
                                  }
                              }
                              result.success(true)
                          } catch (error: Exception) {
                              result.error("MEDIA3_COMMAND_FAILED", error.message, null)
                          }
                      }
              '''
              if needle not in source:
                  raise SystemExit('Could not find configureFlutterEngine closing point for Media3 channel')
              source = source.replace(needle, '\n' + insertion + '    }\n}', 1)
              path.write_text(source)
          print('Verified Flutter method channel for native Media3 queue and transport controls.')
          PY
      - name: Add native AndroidX Media3 playback service
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          package = 'com.samirnet.snplayer'
          kotlin_root = Path('android/app/src/main/kotlin') / Path(*package.split('.'))
          kotlin_root.mkdir(parents=True, exist_ok=True)
          service_path = kotlin_root / 'SMPlayerMediaSessionService.kt'
          service_path.write_text(r'''package com.samirnet.snplayer

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.util.Log
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.common.PlaybackException
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService
          import androidx.media3.session.DefaultMediaNotificationProvider
          import androidx.media3.common.util.UnstableApi
          import java.io.File

          @UnstableApi
          class SMPlayerMediaSessionService : MediaSessionService() {
              private lateinit var player: ExoPlayer
              private lateinit var mediaSession: MediaSession

              override fun onCreate() {
                  super.onCreate()
                  Log.i(TAG, "MediaSessionService created")
                  instance = this
                  // Pin the media notification to an app-owned channel and stable ID.
                  // This avoids relying on a library-default channel configuration on
                  // devices that have previously cached notification settings.
                  setMediaNotificationProvider(
                      DefaultMediaNotificationProvider.Builder(this)
                          .setChannelId("smplayer_media_playback")
                          .setChannelName(R.string.app_name)
                          .setNotificationId(4301)
                          .build()
                  )
                  player = ExoPlayer.Builder(this).build().apply {
                      setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(C.USAGE_MEDIA)
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .build(),
                          true
                      )
                      setHandleAudioBecomingNoisy(true)
                      addListener(object : Player.Listener {
                          override fun onPlaybackStateChanged(playbackState: Int) {
                              Log.i(TAG, "playbackState=$playbackState isPlaying=$isPlaying itemIndex=$currentMediaItemIndex durationMs=$duration")
                          }
                          override fun onIsPlayingChanged(isPlaying: Boolean) {
                              Log.i(TAG, "isPlaying=$isPlaying playWhenReady=$playWhenReady")
                          }
                          override fun onPlayerError(error: PlaybackException) {
                              Log.e(TAG, "ExoPlayer error: ${error.errorCodeName}: ${error.message}", error)
                          }
                      })
                  }
                  mediaSession = MediaSession.Builder(this, player)
                      .setCallback(object : MediaSession.Callback {
                          override fun onConnect(
                              session: MediaSession,
                              controller: MediaSession.ControllerInfo
                          ): MediaSession.ConnectionResult {
                              return super.onConnect(session, controller)
                          }
                      })
                      .build()
              }

              fun currentStateMap(): Map<String, Any> = mapOf(
                  "isPlaying" to player.isPlaying,
                  "isReady" to (player.playbackState == Player.STATE_READY || player.playbackState == Player.STATE_ENDED),
                  "isBuffering" to (player.playbackState == Player.STATE_BUFFERING),
                  "isEnded" to (player.playbackState == Player.STATE_ENDED),
                  "positionMs" to player.currentPosition.coerceAtLeast(0L),
                  "durationMs" to player.duration.coerceAtLeast(0L),
                  "index" to player.currentMediaItemIndex,
                  "width" to player.videoSize.width,
                  "height" to player.videoSize.height,
                  "error" to (player.playerError?.message ?: "")
              )

              private fun playerForViewOrNull(): ExoPlayer? = if (::player.isInitialized) player else null

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession = mediaSession

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.getStringExtra(EXTRA_ACTION)
                  Log.i(TAG, "onStartCommand action=$action startId=$startId")
                  val startResult = super.onStartCommand(intent, flags, startId)
                  when (action) {
                      ACTION_PLAY_QUEUE -> playQueue(intent)
                      ACTION_PLAY -> player.play()
                      ACTION_PAUSE -> player.pause()
                      ACTION_STOP -> {
                          player.pause()
                          player.clearMediaItems()
                          stopSelf()
                      }
                      ACTION_SEEK -> player.seekTo(intent.getLongExtra(EXTRA_POSITION_MS, 0L).coerceAtLeast(0L))
                      ACTION_SKIP_NEXT -> if (player.hasNextMediaItem()) player.seekToNextMediaItem()
                      ACTION_SKIP_PREVIOUS -> if (player.hasPreviousMediaItem()) player.seekToPreviousMediaItem() else player.seekTo(0L)
                      ACTION_SET_SPEED -> player.setPlaybackSpeed(intent.getFloatExtra(EXTRA_SPEED, 1f).coerceIn(0.5f, 2f))
                      ACTION_SET_REPEAT -> player.repeatMode = intent.getIntExtra(EXTRA_REPEAT_MODE, Player.REPEAT_MODE_OFF)
                      ACTION_SET_SHUFFLE -> player.shuffleModeEnabled = intent.getBooleanExtra(EXTRA_SHUFFLE, false)
                      ACTION_SET_VOLUME -> player.volume = intent.getFloatExtra(EXTRA_VOLUME, 1f).coerceIn(0f, 1f)
                  }
                  return startResult
              }

              private fun playQueue(intent: Intent) {
                  val paths = intent.getStringArrayListExtra(EXTRA_PATHS) ?: arrayListOf()
                  val titles = intent.getStringArrayListExtra(EXTRA_TITLES) ?: arrayListOf()
                  if (paths.isEmpty() || paths.size != titles.size) {
                      Log.e(TAG, "Refusing invalid media queue: paths=${paths.size} titles=${titles.size}")
                      return
                  }
                  val missing = paths.filterNot { File(it).isFile }
                  if (missing.isNotEmpty()) {
                      Log.e(TAG, "Queue contains ${missing.size} missing/unreadable file path(s)")
                  }
                  Log.i(TAG, "Preparing media queue size=${paths.size} index=${intent.getIntExtra(EXTRA_INDEX, 0)}")
                  val items = paths.indices.map { index ->
                      val file = File(paths[index])
                      MediaItem.Builder()
                          .setMediaId(file.absolutePath)
                          .setUri(Uri.fromFile(file))
                          .setMediaMetadata(
                              MediaMetadata.Builder()
                                  .setTitle(titles[index].ifBlank { file.name })
                                  .setArtist("SM Player")
                                  .build()
                          )
                          .build()
                  }
                  val index = intent.getIntExtra(EXTRA_INDEX, 0).coerceIn(0, items.lastIndex)
                  val position = intent.getLongExtra(EXTRA_POSITION_MS, 0L).coerceAtLeast(0L)
                  player.setMediaItems(items, index, position)
                  player.prepare()
                  player.playWhenReady = true
              }

              override fun onUpdateNotification(session: MediaSession, startInForegroundRequired: Boolean) {
                  Log.i(TAG, "Media notification update requested: startForeground=$startInForegroundRequired isPlaying=${player.isPlaying} playWhenReady=${player.playWhenReady} mediaId=${player.currentMediaItem?.mediaId}")
                  super.onUpdateNotification(session, startInForegroundRequired)
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  Log.i(TAG, "Task removed while media isPlaying=${player.isPlaying}")
                  if (!player.isPlaying) stopSelf()
              }

              override fun onDestroy() {
                  if (instance === this) instance = null
                  mediaSession.release()
                  player.release()
                  super.onDestroy()
              }

              companion object {
                  private const val TAG = "SMPlayerMediaSession"
                  @Volatile private var instance: SMPlayerMediaSessionService? = null
                  fun currentState(): Map<String, Any> = instance?.currentStateMap() ?: mapOf(
                      "isPlaying" to false, "isReady" to false, "isBuffering" to false, "isEnded" to false,
                      "positionMs" to 0L, "durationMs" to 0L, "index" to -1,
                      "width" to 0, "height" to 0, "error" to ""
                  )
                  fun currentPlayer(): ExoPlayer? = instance?.playerForViewOrNull()
                  const val EXTRA_ACTION = "smplayer.action"
                  const val EXTRA_PATHS = "smplayer.paths"
                  const val EXTRA_TITLES = "smplayer.titles"
                  const val EXTRA_INDEX = "smplayer.index"
                  const val EXTRA_POSITION_MS = "smplayer.positionMs"
                  const val EXTRA_SPEED = "smplayer.speed"
                  const val EXTRA_REPEAT_MODE = "smplayer.repeatMode"
                  const val EXTRA_SHUFFLE = "smplayer.shuffle"
                  const val EXTRA_VOLUME = "smplayer.volume"
                  const val ACTION_PLAY_QUEUE = "playQueue"
                  const val ACTION_PLAY = "play"
                  const val ACTION_PAUSE = "pause"
                  const val ACTION_STOP = "stop"
                  const val ACTION_SEEK = "seek"
                  const val ACTION_SKIP_NEXT = "skipNext"
                  const val ACTION_SKIP_PREVIOUS = "skipPrevious"
                  const val ACTION_SET_SPEED = "setSpeed"
                  const val ACTION_SET_REPEAT = "setRepeatMode"
                  const val ACTION_SET_SHUFFLE = "setShuffle"
                  const val ACTION_SET_VOLUME = "setVolume"
              }
          }
          '''.replace('          ', ''))


          video_view_path = kotlin_root / 'SMPlayerVideoPlatformView.kt'
          video_view_path.write_text(r'''package com.samirnet.snplayer

          import android.content.Context
          import android.view.View
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import io.flutter.plugin.common.StandardMessageCodec
          import io.flutter.plugin.platform.PlatformView
          import io.flutter.plugin.platform.PlatformViewFactory

          class SMPlayerVideoViewFactory : PlatformViewFactory(StandardMessageCodec.INSTANCE) {
              override fun create(context: Context, viewId: Int, args: Any?): PlatformView {
                  val player = SMPlayerMediaSessionService.currentPlayer()
                      ?: throw IllegalStateException("Media3 player must be initialized before creating its video view")
                  return SMPlayerVideoPlatformView(context, player)
              }
          }

          private class SMPlayerVideoPlatformView(
              context: Context,
              player: ExoPlayer
          ) : PlatformView {
              private val playerView = PlayerView(context).apply {
                  this.player = player
                  useController = false
                  resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
              }
              override fun getView(): View = playerView
              override fun dispose() { playerView.player = null }
          }
          '''.replace('          ', ''))

          gradle_candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in gradle_candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android Gradle app file missing while adding Media3')
          text = gradle.read_text()
          dependencies = [
              'androidx.media3:media3-exoplayer:1.8.0',
              'androidx.media3:media3-ui:1.8.0',
              'androidx.media3:media3-session:1.8.0',
          ]
          if gradle.suffix == '.kts':
              block = 'dependencies {'
              additions = ''.join(f'    implementation("{dep}")\n' for dep in dependencies)
              if dependencies[0] not in text:
                  if block in text:
                      text = text.replace(block, block + '\n' + additions, 1)
                  else:
                      text += '\ndependencies {\n' + additions + '}\n'
          else:
              block = 'dependencies {'
              additions = ''.join(f"    implementation '{dep}'\n" for dep in dependencies)
              if dependencies[0] not in text:
                  if block in text:
                      text = text.replace(block, block + '\n' + additions, 1)
                  else:
                      text += '\ndependencies {\n' + additions + '}\n'
          gradle.write_text(text)

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          service = '''    <service
                  android:name="com.samirnet.snplayer.SMPlayerMediaSessionService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true"
                  android:stopWithTask="false">
                  <intent-filter>
                      <action android:name="androidx.media3.session.MediaSessionService" />
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>
          '''
          if 'com.samirnet.snplayer.SMPlayerMediaSessionService' not in manifest:
              manifest = manifest.replace('</application>', service + '    </application>', 1)
          manifest_path.write_text(manifest)
          import xml.etree.ElementTree as ET
          ET.parse(manifest_path)
          if 'androidx.media3:media3-session:1.8.0' not in gradle.read_text():
              raise SystemExit('Media3 session dependency was not written')
          if 'com.samirnet.snplayer.SMPlayerMediaSessionService' not in manifest_path.read_text():
              raise SystemExit('Media3 service was not registered in AndroidManifest.xml')
          print('Added native Media3 ExoPlayer + MediaSessionService, Gradle dependencies and manifest registration.')
          PY
      - name: Set Android app compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle build file was not generated')
          text = path.read_text()
          updated, count = re.subn(r'(?m)^(\s*compileSdk\s*=\s*)flutter\.compileSdkVersion\s*$', r'\g<1>36', text)
          if not count:
              updated, count = re.subn(r'(?m)^(\s*compileSdkVersion\s+)flutter\.compileSdkVersion\s*$', r'\g<1>36', text)
          if count:
              path.write_text(updated)
          elif not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', text):
              raise SystemExit(f'Could not safely set compileSdk to 36 in {path}')
          print(f'Android app compileSdk=36 verified in {path}')
          PY
      - name: Configure Android media permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = [
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_MEDIA_VISUAL_USER_SELECTED',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.WAKE_LOCK',
            'android.permission.MANAGE_EXTERNAL_STORAGE',
          ]
          for permission in permissions:
              if permission in text:
                  continue
              if permission == 'android.permission.READ_EXTERNAL_STORAGE':
                  element = '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
              else:
                  element = f'    <uses-permission android:name="{permission}" />'
              if '<application' not in text:
                  raise SystemExit('AndroidManifest.xml has no application element')
              text = text.replace('<application', element + '\n    <application', 1)
          text = text.replace('android:label="samirnet_player"', 'android:label="SM Player"')
          # Media3 is the sole owner of playback notifications and media buttons.
          # Do not register the legacy audio_service Android service alongside it.
          import re
          text = re.sub(
              r'\s*<service\b(?=[^>]*android:name="com\.ryanheise\.audioservice\.AudioService")[\s\S]*?</service>',
              '',
              text,
          )
          text = re.sub(
              r'\s*<receiver\b(?=[^>]*android:name="com\.ryanheise\.audioservice\.MediaButtonReceiver")[\s\S]*?</receiver>',
              '',
              text,
          )
          path.write_text(text)
          import xml.etree.ElementTree as ET
          ET.parse(path)
          for permission in permissions:
              if permission not in path.read_text():
                  raise SystemExit('Missing media permission: ' + permission)
          print('Verified Android media permissions, manifest XML, and SM Player label')
          PY
      - name: Clean generated Flutter and Android plugin state
        run: |
          flutter clean
          rm -rf .dart_tool build android/.gradle
          rm -f pubspec.lock
      - name: Resolve dependencies reproducibly
        run: |
          flutter pub get
          flutter pub deps --style=compact | grep -E 'shared_preferences(_android)? ' 
      - name: Normalize Android plugin compile SDK versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          gradle_files = sorted(
              p for package in root.iterdir() if package.is_dir()
              for p in (package / 'android').glob('build.gradle*')
          )
          if not gradle_files:
              raise SystemExit('No Android plugin Gradle files found in pub cache')

          updated_files = []
          compile_sdk_files = []
          unsupported = []
          # Normalize every plugin compileSdk declaration, not only the first plugin
          # that happens to fail AAR metadata checks.
          declaration = re.compile(
              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(flutter\.compileSdkVersion|[0-9]+)(\s*(?:\/\/.*)?)$'
          )
          for gradle in gradle_files:
              original = gradle.read_text()
              updated, count = declaration.subn(r'\g<1>36\g<3>', original)
              if count:
                  gradle.write_text(updated)
                  updated_files.append(str(gradle))
              final = gradle.read_text()
              if re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?[^\n]+', final):
                  compile_sdk_files.append(str(gradle))
                  if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*(?:\/\/.*)?$', final):
                      unsupported.append(str(gradle))

          if unsupported:
              raise SystemExit('Could not normalize compileSdk declarations in: ' + ', '.join(unsupported))
          if not compile_sdk_files:
              raise SystemExit('No plugin compileSdk declarations were found to verify')
          print('Normalized plugin Gradle files: ' + str(len(updated_files)))
          print('Verified compileSdk=36 in: ' + str(len(compile_sdk_files)) + ' plugin Gradle files')
          PY
      - name: Align plugin JVM target with Android Java target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          candidates = sorted(root.glob('volume_controller-*/android/build.gradle*'))
          if not candidates:
              print('No volume_controller Android Gradle file found; skipping optional compatibility patch')
          changed = []
          for path in candidates:
              original = path.read_text()
              updated = original
              updated = re.sub(
                  r'''(jvmTarget\s*=\s*["'])1\.8(["'])''',
                  r'\g<1>11\g<2>', updated)
              updated = re.sub(
                  r'''(jvmTarget\s*=\s*)JavaVersion\.VERSION_1_8''',
                  r'\g<1>JavaVersion.VERSION_11', updated)
              updated = re.sub(
                  r'''(JvmTarget\.JVM_1_8)''',
                  'JvmTarget.JVM_11', updated)
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          print('Patched legacy volume_controller JVM targets: ' + (', '.join(changed) if changed else 'none required'))
          PY
