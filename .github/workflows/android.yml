name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.samirnet .
      - name: Align Kotlin and Java JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/build.gradle.kts'), Path('android/build.gradle')]
          root = next((p for p in candidates if p.exists()), None)
          if root is None:
              raise SystemExit('Android root Gradle build file was not generated')
          text = root.read_text()
          marker = '// SamirNet: align Kotlin JVM target for all plugins'
          if marker not in text:
              text += '\n\n' + marker + '\nsubprojects {\n    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n        kotlinOptions.jvmTarget = "11"\n    }\n}\n'
              root.write_text(text)
          print(f'Configured Kotlin JVM target in {root}')
          PY
      - name: Configure Android media permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = '''    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          '''
          if 'android.permission.READ_MEDIA_VIDEO' not in text:
              text = text.replace('<application', permissions + '\n    <application', 1)
          path.write_text(text)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: samirnet-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
