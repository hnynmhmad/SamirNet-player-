name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.samirnet .
      - name: Set Android app compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle build file was not generated')
          text = path.read_text()
          updated, count = re.subn(r'(?m)^(\s*compileSdk\s*=\s*)flutter\.compileSdkVersion\s*$', r'\g<1>36', text)
          if not count:
              updated, count = re.subn(r'(?m)^(\s*compileSdkVersion\s+)flutter\.compileSdkVersion\s*$', r'\g<1>36', text)
          if count:
              path.write_text(updated)
          elif not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', text):
              raise SystemExit(f'Could not safely set compileSdk to 36 in {path}')
          print(f'Android app compileSdk=36 verified in {path}')
          PY
      - name: Configure Android media permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = [
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_VISUAL_USER_SELECTED',
              'android.permission.READ_EXTERNAL_STORAGE',
          ]
          for permission in permissions:
              if permission in text:
                  continue
              if permission == 'android.permission.READ_EXTERNAL_STORAGE':
                  element = '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
              else:
                  element = f'    <uses-permission android:name="{permission}" />'
              if '<application' not in text:
                  raise SystemExit('AndroidManifest.xml has no application element')
              text = text.replace('<application', element + '\\n    <application', 1)
          path.write_text(text)
          print('Verified Android video media permissions in manifest')
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Normalize Android plugin compile SDK versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          gradle_files = sorted(
              p for package in root.iterdir() if package.is_dir()
              for p in (package / 'android').glob('build.gradle*')
          )
          if not gradle_files:
              raise SystemExit('No Android plugin Gradle files found in pub cache')

          updated_files = []
          compile_sdk_files = []
          unsupported = []
          # Normalize every plugin compileSdk declaration, not only the first plugin
          # that happens to fail AAR metadata checks.
          declaration = re.compile(
              r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(flutter\.compileSdkVersion|[0-9]+)(\s*(?:\/\/.*)?)$'
          )
          for gradle in gradle_files:
              original = gradle.read_text()
              updated, count = declaration.subn(r'\g<1>36\g<3>', original)
              if count:
                  gradle.write_text(updated)
                  updated_files.append(str(gradle))
              final = gradle.read_text()
              if re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?[^\n]+', final):
                  compile_sdk_files.append(str(gradle))
                  if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*(?:\/\/.*)?$', final):
                      unsupported.append(str(gradle))

          if unsupported:
              raise SystemExit('Could not normalize compileSdk declarations in: ' + ', '.join(unsupported))
          if not compile_sdk_files:
              raise SystemExit('No plugin compileSdk declarations were found to verify')
          print('Normalized plugin Gradle files: ' + str(len(updated_files)))
          print('Verified compileSdk=36 in: ' + str(len(compile_sdk_files)) + ' plugin Gradle files')
          PY
      - name: Align plugin JVM target with Android Java target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          candidates = sorted(root.glob('volume_controller-*/android/build.gradle*'))
          if not candidates:
              print('No volume_controller Android Gradle file found; skipping optional compatibility patch')
          changed = []
          for path in candidates:
              original = path.read_text()
              updated = original
              updated = re.sub(
                  r'''(jvmTarget\s*=\s*["'])1\.8(["'])''',
                  r'\g<1>11\g<2>', updated)
              updated = re.sub(
                  r'''(jvmTarget\s*=\s*)JavaVersion\.VERSION_1_8''',
                  r'\g<1>JavaVersion.VERSION_11', updated)
              updated = re.sub(
                  r'''(JvmTarget\.JVM_1_8)''',
                  'JvmTarget.JVM_11', updated)
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          print('Patched legacy volume_controller JVM targets: ' + (', '.join(changed) if changed else 'none required'))
          PY
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: samirnet-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
