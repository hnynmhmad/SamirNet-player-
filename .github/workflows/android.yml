name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.samirnet .
      - name: Set Android app compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle build file was not generated')
          text = path.read_text()
          patterns = [
              (r'(?m)^(\s*compileSdk\s*=\s*)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
              (r'(?m)^(\s*compileSdkVersion\s+)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
          ]
          updated = text
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated)
              if count:
                  break
          if updated == text:
              if re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', text):
                  print('Android app compile SDK is already 36')
              else:
                  raise SystemExit(f'Could not safely set compileSdk to 36 in {path}')
          else:
              path.write_text(updated)
              print(f'Set app compileSdk to 36 in {path}')
          PY
      - name: Configure Android media permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = '''    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          '''
          if 'android.permission.READ_MEDIA_VIDEO' not in text:
              text = text.replace('<application', permissions + '\n    <application', 1)
          path.write_text(text)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Set Android library plugins compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          if not root.exists():
              raise SystemExit(f'Pub cache not found: {root}')
          required_prefixes = ('file_picker-', 'flutter_plugin_android_lifecycle-')
          found = {prefix: False for prefix in required_prefixes}
          changed = []
          patterns = [
              (r'(?m)^(\s*compileSdk\s*=\s*)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
              (r'(?m)^(\s*compileSdkVersion\s*=\s*)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
              (r'(?m)^(\s*compileSdkVersion\s+)flutter\.compileSdkVersion\s*$', r'\g<1>36'),
          ]
          for package_dir in root.iterdir():
              if not package_dir.is_dir():
                  continue
              for prefix in required_prefixes:
                  if package_dir.name.startswith(prefix):
                      found[prefix] = True
              for gradle in (package_dir / 'android').glob('build.gradle*'):
                  original = gradle.read_text()
                  updated = original
                  for pattern, replacement in patterns:
                      updated = re.sub(pattern, replacement, updated)
                  if updated != original:
                      gradle.write_text(updated)
                      changed.append(str(gradle))
          missing = [prefix for prefix, exists in found.items() if not exists]
          if missing:
              raise SystemExit('Required Android plugins not found: ' + ', '.join(missing))
          for prefix in required_prefixes:
              for package_dir in root.iterdir():
                  if not package_dir.is_dir() or not package_dir.name.startswith(prefix):
                      continue
                  gradle_files = list((package_dir / 'android').glob('build.gradle*'))
                  if not gradle_files:
                      raise SystemExit(f'No Android Gradle file for {package_dir.name}')
                  for gradle in gradle_files:
                      if re.search(r'flutter\.compileSdkVersion', gradle.read_text()):
                          raise SystemExit(f'compileSdk not updated in {gradle}')
          print('Updated plugin Gradle files: ' + (', '.join(changed) if changed else 'none required'))
          print('Verified file_picker and flutter_plugin_android_lifecycle use explicit compile SDK values.')
          PY
      - name: Align plugin JVM target with Android Java target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          matches = []
          for path in root.glob('volume_controller-*/android/build.gradle*'):
              text = path.read_text()
              updated = re.sub(r'''(jvmTarget\s*=\s*["'])1\.8(["'])''', r'\g<1>11\g<2>', text)
              if updated != text:
                  path.write_text(updated)
                  matches.append(str(path))
          if not matches:
              raise SystemExit('Could not find a volume_controller Gradle JVM target to align')
          print('Aligned Kotlin JVM target to 11 in: ' + ', '.join(matches))
          PY
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: samirnet-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
