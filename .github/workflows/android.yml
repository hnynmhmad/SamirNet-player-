name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.samirnet .
      - name: Set Android app compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit('Android app Gradle build file was not generated')
          text = path.read_text()
          updated, count = re.subn(r'(?m)^(\s*compileSdk\s*=\s*)flutter\.compileSdkVersion\s*$', r'\g<1>36', text)
          if not count:
              updated, count = re.subn(r'(?m)^(\s*compileSdkVersion\s+)flutter\.compileSdkVersion\s*$', r'\g<1>36', text)
          if count:
              path.write_text(updated)
          elif not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', text):
              raise SystemExit(f'Could not safely set compileSdk to 36 in {path}')
          print(f'Android app compileSdk=36 verified in {path}')
          PY
      - name: Configure Android media permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = '''    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          '''
          if 'android.permission.READ_MEDIA_VIDEO' not in text:
              text = text.replace('<application', permissions + '\n    <application', 1)
          path.write_text(text)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Force required Android plugins to compile SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          required = ('file_picker-', 'flutter_plugin_android_lifecycle-')
          found = {prefix: False for prefix in required}
          verified = []

          for package_dir in root.iterdir():
              if not package_dir.is_dir():
                  continue
              prefix = next((p for p in required if package_dir.name.startswith(p)), None)
              if prefix is None:
                  continue
              found[prefix] = True
              gradle_files = list((package_dir / 'android').glob('build.gradle*'))
              if not gradle_files:
                  raise SystemExit(f'Missing Android Gradle file for {package_dir.name}')

              for gradle in gradle_files:
                  original = gradle.read_text()
                  # Handle both Flutter's SDK variable and numeric SDK values (e.g. 34).
                  updated, count = re.subn(
                      r'(?m)^(\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?)(?:flutter\\.compileSdkVersion|[0-9]+)(\\s*)$',
                      r'\\g<1>36\\g<2>',
                      original
                  )
                  if count:
                      gradle.write_text(updated)
                  final = gradle.read_text()
                  if re.search(r'(?m)^\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?(?!36\\b)(?:flutter\\.compileSdkVersion|[0-9]+)', final):
                      raise SystemExit(f'Could not force compileSdk 36 in {gradle}')
                  if not re.search(r'(?m)^\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?36\\s*$', final):
                      raise SystemExit(f'compileSdk=36 not explicitly verified in {gradle}')
                  verified.append(f'{package_dir.name}: {gradle.name}')

          missing = [p for p, exists in found.items() if not exists]
          if missing:
              raise SystemExit('Required plugins not found in pub cache: ' + ', '.join(missing))
          print('Verified explicit compileSdk=36 for: ' + ', '.join(verified))
          PY
      - name: Align plugin JVM target with Android Java target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          matches = []
          for path in root.glob('volume_controller-*/android/build.gradle*'):
              text = path.read_text()
              updated = re.sub(r'''(jvmTarget\s*=\s*["'])1\.8(["'])''', r'\g<1>11\g<2>', text)
              if updated != text:
                  path.write_text(updated)
                  matches.append(str(path))
          if not matches:
              raise SystemExit('Could not find a volume_controller Gradle JVM target to align')
          print('Aligned Kotlin JVM target to 11 in: ' + ', '.join(matches))
          PY
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: samirnet-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
