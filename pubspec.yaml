name: samirnet_player
description: SamirNet Player - Arabic-first local media player for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  photo_manager: ^3.12.0
  video_player: ^2.10.0
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  volume_controller: ^2.0.8
  screen_brightness: ^2.1.4
  wakelock_plus: ^1.3.2
  share_plus: ^10.1.4
  audio_service: ^0.18.18
  just_audio: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
